[program:pdfkrub-worker]
; ──────────────────────────────────────────────────────────────
; PDFkrub Queue Worker — Supervisor Config
; ตำแหน่งไฟล์บน VPS: /etc/supervisor/conf.d/pdfkrub-worker.conf
; ──────────────────────────────────────────────────────────────

; คำสั่งที่รัน (2 processes คือ 2 worker ทำงานพร้อมกัน)
command=php /var/www/pdfkrub/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --memory=256

; จำนวน worker process
numprocs=2
process_name=%(program_name)s_%(process_num)02d

; User ที่รัน
user=www-data

; Auto-start และ Auto-restart
autostart=true
autorestart=true
startsecs=1
startretries=3

; Signal จัดการ graceful restart
stopsignal=TERM
stopasgroup=true
killasgroup=true
stopwaitsecs=3600

; Log
redirect_stderr=true
stdout_logfile=/var/www/pdfkrub/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/pdfkrub/storage/logs/worker-error.log
stderr_logfile_maxbytes=10MB
