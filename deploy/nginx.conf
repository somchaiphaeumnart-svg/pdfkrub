server {
    listen 80;
    listen [::]:80;
    server_name pdfkrub.com www.pdfkrub.com;

    # Redirect all HTTP → HTTPS (Let's Encrypt จะเพิ่ม block นี้อัตโนมัติ)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdfkrub.com www.pdfkrub.com;

    root /var/www/pdfkrub/public;
    index index.php;

    # ─── SSL (certbot จะ inject อัตโนมัติ) ────────────────────
    # ssl_certificate     /etc/letsencrypt/live/pdfkrub.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pdfkrub.com/privkey.pem;

    # ─── Upload limit (PDF ≤ 200 MB + buffer) ─────────────────
    client_max_body_size 210M;
    client_body_timeout  300s;

    # ─── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        font/woff font/woff2 image/svg+xml;

    # ─── Main routing ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ──────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass   unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index  index.php;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_read_timeout  300;
        fastcgi_send_timeout  300;
        fastcgi_connect_timeout 60;
    }

    # ─── Static asset caching ─────────────────────────────────
    location ~* \.(css|js|woff|woff2|ttf|otf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ─── Security — block hidden files ────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ─── Security headers ─────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

    # ─── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/pdfkrub.access.log;
    error_log  /var/log/nginx/pdfkrub.error.log;
}
