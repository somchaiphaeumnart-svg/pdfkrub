services:
  app:
    build:
      context: .
      target: production
    container_name: pdf2word_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      APP_NAME: "pdf2word"
      APP_ENV: "production"
      APP_DEBUG: "false"
      APP_URL: "http://localhost"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "pdf2word"
      DB_USERNAME: "pdf2word_user"
      DB_PASSWORD: "secret_db_password"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "redis"
      CACHE_STORE: "redis"
      SESSION_DRIVER: "redis"
      MAX_UPLOAD_SIZE_MB: "200"
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: pdf2word_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    container_name: pdf2word_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "pdf2word"
      MYSQL_USER: "pdf2word_user"
      MYSQL_PASSWORD: "secret_db_password"
      MYSQL_ROOT_PASSWORD: "root_secret_password"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  storage_data:
  redis_data:
  db_data:
